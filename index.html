<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MONIQ — inteligencia financiera personal: ingresos, egresos, presupuestos y reportes en un solo lugar." />
    <meta name="theme-color" content="#0A1B3D" />
    <title>MONIQ — Inteligencia financiera personal</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar parpadeos.
      try {
        var s = JSON.parse(localStorage.getItem('moniq:v1:settings') || '{}');
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
